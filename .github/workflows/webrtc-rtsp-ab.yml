name: WebRTC vs RTSP startup A/B

on:
  pull_request:
    paths:
      - ".github/workflows/webrtc-rtsp-ab.yml"
      - "benchmarks/webrtc_rtsp_ab/**"
      - "docs/webrtc-rtsp-ab.md"
      - "README.md"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MTX_IMAGE: bluenviron/mediamtx:1.20.1
      RESULT_DIR: results/webrtc-rtsp-ab
      FAKE_VIDEO: /tmp/webrtc-rtsp-ab-source.y4m

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check "selenium==4.35.0" "numpy==2.3.2"

      - name: Record tool versions
        run: |
          ffmpeg -version | head -n 1
          (google-chrome --version || google-chrome-stable --version || true)
          chromedriver --version || true
          docker --version
          python --version

      - name: Generate FullHD 15fps marked source
        run: |
          python benchmarks/webrtc_rtsp_ab/generate_marker_y4m.py \
            --output "$FAKE_VIDEO" \
            --width 1920 \
            --height 1080 \
            --fps 15 \
            --frames 180

      - name: Start MediaMTX
        run: |
          docker pull "$MTX_IMAGE"
          docker run -d --name mediamtx-ab --network host \
            -v "$PWD/benchmarks/webrtc_rtsp_ab/mediamtx.yml:/mediamtx.yml:ro" \
            "$MTX_IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9997/v3/paths/list >/tmp/paths.json; then
              cat /tmp/paths.json
              exit 0
            fi
            sleep 1
          done

          docker logs mediamtx-ab || true
          exit 1

      - name: Run RTSP+FFmpeg vs WebRTC/WHEP comparison
        run: |
          mkdir -p "$RESULT_DIR"
          python benchmarks/webrtc_rtsp_ab/run_ab_compare.py \
            --fake-video "$FAKE_VIDEO" \
            --output-dir "$RESULT_DIR" \
            --repeats 3 \
            --duration 10 \
            --width 1920 \
            --height 1080 \
            --source-fps 15 \
            --modulus 180

      - name: Show summary
        if: always()
        run: |
          if [ -f "$RESULT_DIR/summary.json" ]; then
            cat "$RESULT_DIR/summary.json"
          fi

      - name: Capture MediaMTX logs
        if: always()
        run: |
          mkdir -p "$RESULT_DIR"
          docker logs mediamtx-ab >"$RESULT_DIR/mediamtx.log" 2>&1 || true

      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-rtsp-ab-${{ github.run_id }}
          path: results/webrtc-rtsp-ab
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker rm -f mediamtx-ab || true
